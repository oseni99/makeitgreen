# Reject all cleartext TCP database connections. Network reachability is further
# restricted by the DigitalOcean Cloud Firewall to the application and worker
# trust zones. Runtime roles still authenticate independently with SCRAM.
local all all scram-sha-256
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::0/0 reject
hostssl all all 0.0.0.0/0 scram-sha-256
hostssl all all ::0/0 scram-sha-256
