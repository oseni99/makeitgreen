name: MakeItGreen

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: greenline/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest tests

  challenge-validation:
    name: Challenge validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: greenline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate challenge invariants
        run: python scripts/validate_challenges.py

  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: greenline/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: greenline/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
